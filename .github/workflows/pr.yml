# pr.yml — exécute les contrôles d'une pull request : Terraform, build, scan.
#
# Lu par GitHub Actions à chaque pull request visant main. On y modifie une étape
# quand un contrôle change ; les actions et leurs versions restent épinglées.
# Il ne déploie rien : le build se fait sans push.
name: PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  terraform:
    name: Terraform fmt / validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.15.9
          terraform_wrapper: false

      - name: fmt
        run: terraform fmt -check -recursive

      # Aucun identifiant Azure dans la CI : `terraform plan` demande l'état
      # distant et un jeton, il est donc lancé à la main (voir le README).
      # `validate` n'a besoin ni de l'un ni de l'autre, tant que le backend n'est
      # pas initialisé.
      - name: init
        run: terraform init -backend=false -input=false

      - name: validate
        run: terraform validate

  build:
    name: Build, lint and scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.10.0

      - name: Build image (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.13.0
        with:
          context: app
          load: true
          push: false
          tags: demo-cours-app:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate compose files
        run: |
          docker compose --env-file stack/.env.example -f stack/docker-compose.yml config -q
          docker compose --env-file stack/.env.example -f stack/docker-compose.yml -f stack/docker-compose.local.yml config -q

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: demo-cours-app:pr-${{ github.event.pull_request.number }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan infrastructure for misconfigurations
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore.yaml
