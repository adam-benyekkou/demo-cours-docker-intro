name: PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "0"
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

jobs:
  terraform:
    name: Terraform fmt / validate / plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.15.9
          terraform_wrapper: false

      - name: fmt
        run: terraform fmt -check -recursive

      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.2.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Resource group and storage account are the only values a run of
      # infra/bootstrap/bootstrap.sh generates; the rest lives in backend.tf.
      - name: init
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}"

      - name: validate
        run: terraform validate

      - name: plan
        id: plan
        env:
          TF_VAR_budget_contact_emails: ${{ vars.BUDGET_CONTACT_EMAILS || '[]' }}
          TF_VAR_admin_ssh_public_key: ${{ vars.ADMIN_SSH_PUBLIC_KEY }}
        run: |
          set -o pipefail
          terraform plan -input=false -no-color -lock=false -out=tfplan | tee plan.txt
        continue-on-error: true

      - name: comment plan on PR
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.0.1
        with:
          script: |
            const fs = require("fs");
            let plan = "";
            try {
              plan = fs.readFileSync("infra/plan.txt", "utf8");
            } catch (err) {
              plan = `(plan output not found: ${err.message})`;
            }
            const body = [
              `### Terraform plan — \`${{ steps.plan.outcome }}\``,
              "```",
              plan.slice(-60000),
              "```",
            ].join("\n");
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const mine = comments.data.find(c => c.user.type === "Bot" && c.body.startsWith("### Terraform plan"));
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

  build:
    name: Build, lint and scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.10.0

      - name: Build image (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.13.0
        with:
          context: app
          load: true
          push: false
          tags: demo-cours-app:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate compose files
        run: |
          mkdir -p stack/secrets
          printf 'pr\n' > stack/secrets/grafana_admin_password
          docker compose --env-file stack/.env.example -f stack/docker-compose.yml config -q
          docker compose --env-file stack/.env.example -f stack/docker-compose.yml -f stack/docker-compose.local.yml config -q

      - name: Validate YAML
        run: python3 scripts/check-yaml.py

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: demo-cours-app:pr-${{ github.event.pull_request.number }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan infrastructure for misconfigurations
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore.yaml
