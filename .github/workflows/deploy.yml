name: Deploy

# Runs on the self-hosted runner installed on the VM itself (scripts/runner-install.sh),
# on `push: main` only. A pull_request must never reach that runner: it executes
# the code of the branch it checks out.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy on the VM
    runs-on: [self-hosted, democours]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Write stack environment
        env:
          DOMAIN: ${{ vars.DOMAIN }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          : "${DOMAIN:?repository variable DOMAIN is empty}"
          : "${GRAFANA_ADMIN_PASSWORD:?secret GRAFANA_ADMIN_PASSWORD is empty}"
          case "$GRAFANA_ADMIN_PASSWORD" in
            *$'\n'*|*$'\r'*) echo "GRAFANA_ADMIN_PASSWORD must be a single line" >&2; exit 1 ;;
          esac

          umask 077
          cat > stack/.env <<EOF
          DOMAIN=${DOMAIN}
          GRAFANA_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
          APP_VERSION=${GITHUB_SHA}
          EOF

      - name: Build and start the stack
        run: |
          set -euo pipefail
          docker compose --env-file stack/.env -f stack/docker-compose.yml up -d --build --remove-orphans
          docker image prune -f >/dev/null
          docker compose --env-file stack/.env -f stack/docker-compose.yml ps

      - name: Smoke test
        env:
          DOMAIN: ${{ vars.DOMAIN }}
        run: |
          set -euo pipefail
          base="https://${DOMAIN}"
          code() { curl -s -o /dev/null -w '%{http_code}' "$1"; }

          curl -fsS --retry 12 --retry-delay 10 --retry-all-errors "${base}/health" \
            | grep -q '"status":"Healthy"'
          curl -fsS "${base}/" | grep -q 'Bonjour depuis le conteneur'

          # Grafana starts slower than the rest (migrations, plugin bootstrap):
          # wait for its login page instead of testing it once.
          wait_for() {
            for _ in $(seq 1 18); do
              [ "$(code "$1")" = "$2" ] && return 0
              sleep 10
            done
            return 1
          }

          test "$(code "${base}/metrics")" = 404 || { echo "public /metrics is not closed" >&2; exit 1; }
          wait_for "${base}/grafana/login" 200 || { echo "grafana login is not reachable" >&2; exit 1; }
          test "$(code "${base}/grafana/metrics")" != 200 || { echo "grafana metrics is public" >&2; exit 1; }

          echo "smoke test ok on ${base}"
