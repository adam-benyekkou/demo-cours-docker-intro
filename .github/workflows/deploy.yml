name: Deploy

# Runs on the self-hosted runner installed on the VM itself (scripts/runner-install.sh),
# on `push: main` only. A pull_request must never reach that runner: it executes
# the code of the branch it checks out.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  APP_IMAGE: demo-cours-app

jobs:
  deploy:
    name: Build and deploy on the VM
    runs-on: [self-hosted, democours]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      # The stack reads its Grafana password from a mounted file, never from the
      # container environment, so `docker inspect` never carries the value.
      - name: Write stack environment
        env:
          DOMAIN: ${{ vars.DOMAIN }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          : "${DOMAIN:?repository variable DOMAIN is empty}"
          : "${GRAFANA_ADMIN_PASSWORD:?secret GRAFANA_ADMIN_PASSWORD is empty}"
          case "$GRAFANA_ADMIN_PASSWORD" in
            *$'\n'*|*$'\r'*) echo "GRAFANA_ADMIN_PASSWORD must be a single line" >&2; exit 1 ;;
          esac

          umask 077
          cat > stack/.env <<EOF
          APP_IMAGE=${APP_IMAGE}
          APP_IMAGE_TAG=${GITHUB_SHA}
          DOMAIN=${DOMAIN}
          GRAFANA_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
          EOF

          # The previous run left this file 0400 and owned by Grafana's uid; the
          # directory is ours, so removing it is allowed. chmod must precede chown:
          # once the file belongs to 472 this user can no longer change its mode.
          install -d -m 0755 stack/secrets
          secret=stack/secrets/grafana_admin_password
          rm -f "$secret"
          printf '%s' "$GRAFANA_ADMIN_PASSWORD" > "$secret"
          chmod 0400 "$secret"
          sudo -n chown 472:472 "$secret"

      - name: Build image
        run: docker build -t "${APP_IMAGE}:${GITHUB_SHA}" app/

      - name: Start the stack
        run: |
          set -euo pipefail
          docker compose --env-file stack/.env -f stack/docker-compose.yml up -d --remove-orphans
          docker image prune -f >/dev/null
          docker compose --env-file stack/.env -f stack/docker-compose.yml ps

      - name: Smoke test
        env:
          DOMAIN: ${{ vars.DOMAIN }}
        run: |
          set -euo pipefail
          base="https://${DOMAIN}"
          code() { curl -s -o /dev/null -w '%{http_code}' "$1"; }

          curl -fsS --retry 12 --retry-delay 10 --retry-all-errors "${base}/health" \
            | grep -q '"status":"Healthy"'
          curl -fsS "${base}/" | grep -q 'Bonjour depuis le conteneur'
          curl -sI "${base}/" | grep -qi '^strict-transport-security:'

          test "$(code "${base}/metrics")" = 404 || { echo "public /metrics is not closed" >&2; exit 1; }
          test "$(code "${base}/grafana/login")" = 200 || { echo "grafana login is not reachable" >&2; exit 1; }
          test "$(code "${base}/grafana/metrics")" != 200 || { echo "grafana metrics is public" >&2; exit 1; }

          echo "smoke test ok on ${base}"
