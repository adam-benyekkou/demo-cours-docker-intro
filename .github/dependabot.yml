version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /app
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /stack
    schedule:
      interval: weekly
    ignore:
      # cAdvisor 0.53+ needs the containerd gRPC socket, which the socket proxy
      # cannot provide (see docs/securite.md).
      - dependency-name: gcr.io/cadvisor/cadvisor
        versions: [">=0.53.0"]

  - package-ecosystem: terraform
    directory: /infra
    schedule:
      interval: weekly

  - package-ecosystem: nuget
    directory: /app
    schedule:
      interval: weekly
