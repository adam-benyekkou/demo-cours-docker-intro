# dependabot.yml — planifie les mises à jour de dépendances, un écosystème à la fois.
#
# Lu par Dependabot une fois par semaine pour chaque répertoire listé. On y ajoute
# un écosystème ou un répertoire ; il n'ouvre que des pull requests, sans merger.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /app
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /stack
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: /infra
    schedule:
      interval: weekly

  - package-ecosystem: nuget
    directory: /app
    schedule:
      interval: weekly
