# En-têtes de sécurité appliqués par les routeurs publics, et limite de débit
# sur Grafana. Pas de CSP : les pages Grafana utilisent scripts et styles inline.
http:
  middlewares:
    security-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        contentTypeNosniff: true
        frameDeny: true
        referrerPolicy: strict-origin-when-cross-origin
        permissionsPolicy: "geolocation=(), microphone=(), camera=()"

    grafana-ratelimit:
      rateLimit:
        average: 30
        period: 1s
        burst: 60
