# Configuration statique de Traefik. Les routeurs viennent des labels Docker
# du compose : c'est là qu'est la partie déclarative.

log:
  level: INFO

accessLog:
  format: json
  fields:
    headers:
      defaultMode: drop

ping:
  entryPoint: traefik

entryPoints:
  web:
    address: ":80"
    forwardedHeaders:
      trustedIPs:
        - 10.20.0.0/16
  websecure:
    address: ":443"
    http:
      tls: {}
    forwardedHeaders:
      trustedIPs:
        - 10.20.0.0/16
  traefik:
    address: ":8080"
  metrics:
    address: ":8082"

providers:
  docker:
    endpoint: "tcp://socket-proxy:2375"
    exposedByDefault: false
    # Nom réel du réseau Docker : le projet compose est épinglé à `demo-stack`.
    network: demo-stack_edge
    watch: true
  file:
    directory: /etc/traefik/dynamic
    watch: true

metrics:
  prometheus:
    entryPoint: metrics
    addEntryPointsLabels: true
    addServicesLabels: true

certificatesResolvers:
  le:
    acme:
      storage: /acme/acme.json
      httpChallenge:
        entryPoint: web
