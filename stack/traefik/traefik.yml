# Configuration statique de Traefik. Les routeurs viennent des labels Docker
# du compose : c'est là qu'est la partie déclarative.

# Les alias d'en-têtes (X_Auth_User pour X-Auth-User) sont supprimés avant
# d'atteindre les backends : ils permettent de contourner les en-têtes gérés
# par Traefik.
global:
  aliasHeadersStrategy: delete

log:
  level: INFO

accessLog:
  format: json
  fields:
    headers:
      defaultMode: drop

ping:
  entryPoint: traefik

entryPoints:
  web:
    address: ":80"
  # Certificat Let's Encrypt pour tout routeur TLS de cet entrypoint ; le
  # certificat auto-signé local reste servi tant que l'ACME n'a pas abouti.
  websecure:
    address: ":443"
    http:
      tls:
        certResolver: le
  traefik:
    address: ":8080"
  metrics:
    address: ":8082"

providers:
  docker:
    endpoint: "tcp://socket-proxy:2375"
    exposedByDefault: false
    # Nom réel du réseau Docker : le projet compose est épinglé à `demo-stack`.
    network: demo-stack_edge
    watch: true
  file:
    directory: /etc/traefik/dynamic
    watch: true

metrics:
  prometheus:
    entryPoint: metrics
    addEntryPointsLabels: true
    addServicesLabels: true

certificatesResolvers:
  le:
    acme:
      storage: /acme/acme.json
      httpChallenge:
        entryPoint: web
