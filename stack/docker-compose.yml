# docker-compose.yml — décrit les six services de la démo et leur routage.
#
# Fichier de référence du déploiement : c'est ici qu'on ajoute ou modifie un service.
# Traefik y tient toute sa configuration, sans fichier externe : entrypoints et ACME en flags.
# La stack tourne sur le réseau par défaut de Compose, sans réseau déclaré.
name: demo-stack

# Détail des choix, et de ce qu'on accepte de perdre (en-têtes de sécurité,
# socket-proxy, utilisateur non-root) : voir le README.

services:
  traefik:
    image: traefik:v3.8.0
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      # HTTP -> HTTPS sur l'entrypoint. Le résolveur ACME reste en TLS-ALPN-01
      # pour ne pas dépendre du port 80.
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls.certresolver=le
      # Métriques Prometheus sur un entrypoint interne, jamais publié.
      - --entrypoints.metrics.address=:8082
      - --metrics.prometheus.entryPoint=metrics
      - --metrics.prometheus.addEntryPointsLabels=true
      - --metrics.prometheus.addServicesLabels=true
      - --certificatesresolvers.le.acme.tlschallenge=true
      - --certificatesresolvers.le.acme.storage=/acme/acme.json
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /data/traefik:/acme

  app:
    build: ../app
    restart: unless-stopped
    environment:
      APP_VERSION: ${APP_VERSION:-dev}
    expose:
      - "8080"
    labels:
      - traefik.enable=true
      # /metrics reste interne : Prometheus l'appelle sur le réseau Docker.
      - traefik.http.routers.app.rule=Host(`${DOMAIN:?DOMAIN is required}`) && !PathPrefix(`/metrics`)
      - traefik.http.routers.app.entrypoints=websecure
      - traefik.http.routers.app.priority=10
      - traefik.http.services.app.loadbalancer.server.port=8080

  prometheus:
    image: prom/prometheus:v3.16.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /data/prometheus:/prometheus

  node-exporter:
    image: prom/node-exporter:v1.13.1
    restart: unless-stopped
    pid: host
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+)($|/)
    volumes:
      - /:/host:ro,rslave

  # cAdvisor lit le socket Docker et le socket containerd. Docker 29 utilise par
  # défaut le snapshotter containerd : sans le second socket, cAdvisor enregistre
  # bien la fabrique Docker mais ne retrouve aucune couche inscriptible et le
  # dashboard « Conteneurs » reste vide. Les deux sockets sont montés en lecture
  # seule.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    restart: unless-stopped
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
    volumes:
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
    devices:
      - /dev/kmsg

  grafana:
    image: grafana/grafana:13.2.6
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_METRICS_ENABLED: "false"
      GF_SERVER_ROOT_URL: https://${DOMAIN:?DOMAIN is required}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - /data/grafana:/var/lib/grafana
    labels:
      - traefik.enable=true
      - traefik.http.routers.grafana.rule=Host(`${DOMAIN:?DOMAIN is required}`) && PathPrefix(`/grafana`)
      - traefik.http.routers.grafana.entrypoints=websecure
      - traefik.http.routers.grafana.priority=100
      - traefik.http.services.grafana.loadbalancer.server.port=3000
