# prometheus.yml — déclare Prometheus comme source de données Grafana.
#
# Provisionné au démarrage de Grafana : c'est ici qu'on change l'URL ou l'UID de la source.
# La source n'est pas modifiable depuis l'interface (editable: false).
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
