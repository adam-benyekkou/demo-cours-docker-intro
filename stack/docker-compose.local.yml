# Surcharge locale : volumes nommés au lieu des chemins /data de la VM, et
# ports 18080/18443 (les ports 80/443 de l'hôte sont souvent pris par d'autres
# conteneurs de cours). Traefik sert alors son certificat auto-signé par défaut.
services:
  traefik:
    ports: !override
      - "18080:80"
      - "18443:443"
    volumes: !override
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-acme:/acme

  prometheus:
    volumes: !override
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus

  grafana:
    volumes: !override
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  traefik-acme:
  prom-data:
  grafana-data:
